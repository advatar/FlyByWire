name: FlyBrainWorldVision
options:
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: FlyBrainWorldVision
    PRODUCT_BUNDLE_IDENTIFIER: com.advatar.flybrain.worldvision
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: FlyBrainWorldVision/Info.plist
    CODE_SIGN_STYLE: Automatic
targets:
  FlyBrainWorldVision:
    type: application
    platform: visionOS
    deploymentTarget: "2.0"
    sources:
      - path: FlyBrainWorldVision/Sources
      - path: ../../shared/FlyWorldShared
      - path: ../../shared/FlyWorldSharedResources
        buildPhase: resources
      - path: ../FlyBrainVision/FlyBrainVision/Resources/flybrain_for_vision_pro.json
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 7
