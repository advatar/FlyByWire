name: FlyBrainWorldMac
options:
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: FlyBrainWorldMac
    PRODUCT_BUNDLE_IDENTIFIER: com.advatar.flybrain.worldmac
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
targets:
  FlyBrainWorldMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: FlyBrainWorldMac/Sources
      - path: ../../shared/FlyWorldShared
      - path: ../../shared/FlyWorldSharedResources
        buildPhase: resources
      - path: ../../vision-pro/FlyBrainVision/FlyBrainVision/Resources/flybrain_for_vision_pro.json
        buildPhase: resources
  FlyBrainWorldMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: FlyBrainWorldMac/Tests
    dependencies:
      - target: FlyBrainWorldMac
    settings:
      base:
        PRODUCT_NAME: FlyBrainWorldMacTests
        PRODUCT_MODULE_NAME: FlyBrainWorldMacTests
